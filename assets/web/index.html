    <script>
      (() => {
        let mode = 'system';
        let resolved = '';
        try {
          const stored = localStorage.getItem('fileharbor-mode');
          mode = (stored === 'light' || stored === 'dark' || stored === 'system') ? stored : 'system';
        } catch (_) {}
        const mediaDark = typeof window.matchMedia === 'function' && window.matchMedia('(prefers-color-scheme: dark)').matches;
        resolved = mode === 'light' ? 'light' : mode === 'dark' ? 'dark' : (mediaDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-mui-color-scheme', resolved);
      })();
    </script>
