name: Release FileHarbor

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and upload assets for
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-fileharbor-binary:
    name: ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64, "386"]
        exclude:
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: "386"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"
          cache: true
      - name: Build release archive
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          asset_name="fileharbor-${GOOS}-${GOARCH}"
          mkdir -p dist

          if [ "$GOOS" = "windows" ]; then
            binary="fileharbor.exe"
          else
            binary="fileharbor"
          fi

          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "dist/${binary}" .

          if [ "$GOOS" = "windows" ]; then
            archive="${asset_name}.zip"
            (
              cd dist
              zip -q "${archive}" "${binary}"
            )
          else
            archive="${asset_name}.tar.gz"
            tar -C dist -czf "dist/${archive}" "${binary}"
          fi

          rm "dist/${binary}"
          sha256sum "dist/${archive}" > "dist/${archive}.sha256"
      - name: Publish installer
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$RELEASE_TAG" fileharbor.sh --clobber
      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
