name: Release Go

on:
  workflow_dispatch:
  release:
    types: [published]

# Release assets are uploaded with the repository-scoped GITHUB_TOKEN. The
# default token may be read-only, so explicitly grant the action write access.
permissions:
  contents: write

jobs:
  build-go-binary:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin,windows]
        goarch: [amd64, arm64,"386"]
        exclude:
          - goarch: arm64
            goos: windows
          - goarch: "386"
            goos: darwin
    steps:
      - uses: actions/checkout@v4
      - uses: wangyoucao577/go-release-action@v1.36
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          goos: ${{ matrix.goos }}
          goarch: ${{ matrix.goarch }}
          goversion: go.mod
          binary_name: goFile
          asset_name: goFile-${{ matrix.goos }}-${{ matrix.goarch }}
