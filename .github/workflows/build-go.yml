name: Release FileHarbor

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build or repair
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve-release:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: release
        name: Verify tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git fetch --force --tags origin
          git ls-remote --exit-code --refs origin "refs/tags/$RELEASE_TAG" >/dev/null
          sha="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          printf 'tag=%s\nsha=%s\n' "$RELEASE_TAG" "$sha" >> "$GITHUB_OUTPUT"

  frontend:
    name: Frontend
    needs: resolve-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Test
        working-directory: web
        run: npm test
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Type check
        working-directory: web
        run: npm run typecheck
      - name: Remove generated frontend output
        shell: bash
        run: rm -rf assets/web
      - name: Build
        working-directory: web
        run: npm run build
      - name: Check generated frontend output
        shell: bash
        run: |
          set -euo pipefail
          test -d assets/web
          test -n "$(git ls-files -- assets/web)"
          git diff --exit-code -- assets/web
          test -z "$(git ls-files --others --exclude-standard -- assets/web)"

  verify:
    name: Verify ${{ matrix.os }}
    needs: [resolve-release, frontend]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # gofmt output is platform-independent. Run this once on Linux so a Windows
      # checkout's line-ending conversion cannot make an otherwise formatted tree fail.
      - name: Check formatting
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git ls-files '*.go' | xargs -r gofmt -l)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Race test
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: Build
        run: go build ./...
      - name: Build release targets
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          for target in \
            linux/amd64 linux/arm64 linux/386 \
            darwin/amd64 darwin/arm64 \
            windows/amd64 windows/386; do
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 go build -o /dev/null .
          done

  build-fileharbor-binary:
    needs: [resolve-release, frontend, verify]
    name: ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64, "386"]
        exclude:
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: "386"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build release archive
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          asset_name="fileharbor-${GOOS}-${GOARCH}"
          mkdir -p dist

          if [ "$GOOS" = "windows" ]; then
            binary="fileharbor.exe"
          else
            binary="fileharbor"
          fi

          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "dist/${binary}" .

          if [ "$GOOS" = "windows" ]; then
            archive="${asset_name}.zip"
            (
              cd dist
              zip -q "${archive}" "${binary}"
              test "$(unzip -Z1 "${archive}")" = "${binary}"
            )
          else
            archive="${asset_name}.tar.gz"
            tar -C dist -czf "dist/${archive}" "${binary}"
            test "$(tar -tzf "dist/${archive}")" = "${binary}"
          fi

          rm "dist/${binary}"
          (
            cd dist
            sha256sum "${archive}" > "${archive}.sha256"
          )
          test -s "dist/${archive}"
          test -s "dist/${archive}.sha256"
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [resolve-release, build-fileharbor-binary]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.sha }}
          fetch-depth: 0
      - name: Verify installer
        shell: bash
        run: |
          set -euo pipefail
          test -s fileharbor.sh
          bash -n fileharbor.sh
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Verify release assets and remote tag
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
          RELEASE_SHA: ${{ needs.resolve-release.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          test "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" = "$RELEASE_SHA"

          expected=(
            fileharbor-linux-amd64.tar.gz
            fileharbor-linux-arm64.tar.gz
            fileharbor-linux-386.tar.gz
            fileharbor-darwin-amd64.tar.gz
            fileharbor-darwin-arm64.tar.gz
            fileharbor-windows-amd64.zip
            fileharbor-windows-386.zip
          )
          for archive in "${expected[@]}"; do
            test -s "dist/${archive}"
            test -s "dist/${archive}.sha256"
          done
          (
            cd dist
            sha256sum --check ./*.sha256
          )
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 14
      - name: Create or repair release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" fileharbor.sh dist/* --clobber
          else
            gh release create "$RELEASE_TAG" fileharbor.sh dist/* \
              --verify-tag \
              --generate-notes \
              --title "$RELEASE_TAG"
          fi
