# Go source verification for every pull request and supported native target.
name: Verify Go

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./...
      - name: Build Docker image
        if: runner.os == 'Linux'
        run: docker build --tag gofile:ci .
      - name: Smoke-test Docker image
        if: runner.os == 'Linux'
        run: docker run --rm gofile:ci -h
