# Go and React/Vite verification for every pull request and supported native target.
name: Verify FileHarbor

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Test
        working-directory: web
        run: npm test
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Type check
        working-directory: web
        run: npm run typecheck
      - name: Remove generated frontend output
        shell: bash
        run: rm -rf assets/web
      - name: Build
        working-directory: web
        run: npm run build
      - name: Check generated frontend output
        shell: bash
        run: |
          set -euo pipefail
          test -d assets/web
          test -n "$(git ls-files -- assets/web)"
          git diff --exit-code -- assets/web
          test -z "$(git ls-files --others --exclude-standard -- assets/web)"

  verify:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # gofmt output is platform-independent. Run this once on Linux so a Windows
      # checkout's line-ending conversion cannot make an otherwise formatted tree fail.
      - name: Check formatting
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git ls-files '*.go' | xargs -r gofmt -l)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Race test
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: Build
        run: go build ./...
      - name: Build release targets
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          for target in \
            linux/amd64 linux/arm64 linux/386 \
            darwin/amd64 darwin/arm64 \
            windows/amd64 windows/386; do
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 go build -o /dev/null .
          done
