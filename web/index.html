<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="csrf-token" content="" />
    <meta name="fileharbor-runtime" content="{}" />
    <script>
      (() => {
        let mode = 'system';
        let accent = 'forest';
        try {
          const storedMode = localStorage.getItem('fileharbor-mode');
          const storedAccent = localStorage.getItem('fileharbor-accent');
          mode = (storedMode === 'light' || storedMode === 'dark' || storedMode === 'system') ? storedMode : 'system';
          accent = (
            storedAccent === 'forest' ||
            storedAccent === 'harbor' ||
            storedAccent === 'slate' ||
            storedAccent === 'orchid' ||
            storedAccent === 'cedar' ||
            storedAccent === 'fjord' ||
            storedAccent === 'juniper' ||
            storedAccent === 'ember' ||
            storedAccent === 'dune' ||
            storedAccent === 'saffron' ||
            storedAccent === 'mulberry' ||
            storedAccent === 'graphite'
          ) ? storedAccent : 'forest';
        } catch (_) {}
        const mediaDark = typeof window.matchMedia === 'function' && window.matchMedia('(prefers-color-scheme: dark)').matches;
        const resolved = mode === 'light' ? 'light' : mode === 'dark' ? 'dark' : (mediaDark ? 'dark' : 'light');
        const root = document.documentElement;
        root.setAttribute('data-mui-color-scheme', resolved);
        root.setAttribute('data-fileharbor-accent', accent);
      })();
    </script>
    <link rel="stylesheet" href="/src/prepaint.css" />
    <title>FileHarbor</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
